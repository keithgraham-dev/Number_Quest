<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Number Quest</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="game-card">
    <p class="eyebrow">A number guessing game</p>
    <h1>Number Quest</h1>
    <p class="introduction">
      A secret number is waiting between 1 and 100. Can you find it?
    </p>

    <form id="guess-form" novalidate>
      <label for="guess-input">Your guess</label>
      <div class="guess-controls">
        <input
          id="guess-input"
          name="guess"
          type="number"
          min="1"
          max="100"
          step="1"
          placeholder="Enter 1–100"
          inputmode="numeric"
          autocomplete="off"
          aria-describedby="feedback"
        >
        <button class="button button-primary" type="submit">Guess</button>
      </div>
    </form>

    <p id="feedback" class="feedback" role="status" aria-live="polite">
      Make your first guess to begin.
    </p>

    <div class="game-footer">
      <p id="attempts" class="attempts" aria-live="polite">Attempts: 0</p>
      <button id="restart-button" class="button button-secondary" type="button">
        Restart
      </button>
    </div>
  </main>
</body>
</html>
